name: Publish to Winget

# manual only - the winget package has to exist before this can publish anything to it,
# and it used to run automatically on every published release as Fishstrap.Fishstrap
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Goosetrap.Goosetrap
          token: ${{ secrets.WINGET_TOKEN }}
